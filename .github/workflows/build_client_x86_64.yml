name: Build Worker Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client_requirements.txt

      - name: Install Nuitka
        run: pip install nuitka

      - name: Build standalone binary with Nuitka
        run: |
          mkdir -p build

          nuitka --standalone \
                 --onefile \
                 --output-dir=build \
                 --output-filename=worker_${{ matrix.os }} \
                 client.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client_${{ matrix.os }}
          path: build/worker_${{ matrix.os }}
          if-no-files-found: error

      - name: Commit binary to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build/worker_${{ matrix.os }}

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build: update ${{ matrix.os }} worker binary [skip ci]"
          git push