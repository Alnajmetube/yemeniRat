name: Build Termux Standalone Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Build Standalone Binary inside Termux Environment
        run: |
          # تجهيز مجلد المخرجات على المستضيف
          mkdir -p build
          sudo chmod -R 777 build

          docker run --rm -v ${{ github.workspace }}:/workspace termux/termux-docker:aarch64 bash -c "
            pkg update -y && pkg upgrade -y
            pkg install python clang build-essential patchelf zstd ccache termux-elf-cleaner -y

            pip install -r /workspace/client_requirements.txt
            pip install nuitka

            # النسخ إلى مجلد مؤقت داخل الحاوية للعمل بحرية وبدون أخطاء صلاحيات
            mkdir -p /tmp/work
            cp -r /workspace/* /tmp/work/
            cd /tmp/work

            nuitka --standalone \
                   --onefile \
                   --lto=yes \
                   --remove-output \
                   --output-dir=build_out \
                   --output-filename=termux_client_arm64 \
                   client.py

            strip build_out/termux_client_arm64

            # نقل الملف التنفيذي النهائي إلى المجلد الخارجي
            cp build_out/termux_client_arm64 /workspace/build/
          "

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux_client_arm64
          path: build/termux_client_arm64