name: Build ARM64 standalone binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client_requirements.txt
          pip install nuitka

      - name: Build standalone binary with Nuitka
        run: |
          mkdir -p build

          nuitka \
            --standalone \
            --onefile \
            --output-dir=build \
            --output-filename=client \
            client.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-arm64
          path: build/client
          if-no-files-found: error

      - name: Commit binary to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build/client

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "build: update ARM64 binary [skip ci]"
          git push