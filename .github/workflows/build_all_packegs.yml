name: Build All Packages (Linux & Termux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-all-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  # =========================================================
  # 1) بناء ARM64 (Runner أصلي من GitHub - بدون محاكاة)
  # =========================================================
  build-arm64:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf python3-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r client_requirements.txt
          pip install nuitka

      - name: Build standalone binary with Nuitka
        run: |
          nuitka --standalone --onefile --output-dir=build --output-filename=client client.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-arm64
          path: build/client

  # =========================================================
  # 2) بناء ARMv7 (عبر QEMU - صورة python:3.10-slim)
  # =========================================================
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: إعداد QEMU لمحاكاة ARMv7
        uses: docker/setup-qemu-action@v3

      - name: بناء الملف الثنائي داخل حاوية Linux ARMv7
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            python:3.10-slim \
            bash -c "
              set -e
              apt-get update && apt-get install -y --no-install-recommends \
                gcc g++ make patchelf zstd ccache python3-dev binutils
              pip install --upgrade pip
              pip install -r client_requirements.txt
              pip install nuitka

              python -m nuitka \
                --standalone \
                --onefile \
                --lto=yes \
                --remove-output \
                --output-dir=build \
                --output-filename=worker-armv7l \
                client.py

              strip build/worker-armv7l
            "

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: worker-armv7l
          path: build/worker-armv7l
          if-no-files-found: error

  # =========================================================
  # 3) بناء عام على أوبنتو 20.04 / 22.04 (matrix)
  # =========================================================
  build-ubuntu-20:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python -m pip install --upgrade pip
          pip install -r client_requirements.txt
          pip install nuitka

      - name: Build
        run: |
          nuitka --standalone --onefile \
            --output-dir=build \
            --output-filename=worker_ubuntu20 \
            client.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-ubuntu20
          path: build/worker_ubuntu20

  build-ubuntu-22:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python -m pip install --upgrade pip
          pip install -r client_requirements.txt
          pip install nuitka

      - name: Build
        run: |
          nuitka --standalone --onefile \
            --output-dir=build \
            --output-filename=worker_ubuntu22 \
            client.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-ubuntu22
          path: build/worker_ubuntu22
  # =========================================================
  # 4) بناء Termux ARM64 (عبر QEMU - صورة termux-docker:aarch64)
  # =========================================================
  build-termux-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Build Standalone Binary inside Termux Environment
        run: |
          mkdir -p ${{ github.workspace }}/build
          sudo chmod -R 777 ${{ github.workspace }}

          docker run --rm -v ${{ github.workspace }}:/workspace termux/termux-docker:aarch64 bash -c "
            pkg update -y && pkg upgrade -y
            pkg install python clang build-essential patchelf zstd ccache termux-elf-cleaner ldd binutils -y

            pip install -r /workspace/client_requirements.txt
            pip install nuitka

            WORK_DIR=\$HOME/work
            mkdir -p \$WORK_DIR
            cp -r /workspace/* \$WORK_DIR/
            cd \$WORK_DIR

            nuitka --standalone \
                   --onefile \
                   --lto=yes \
                   --remove-output \
                   --output-dir=build_out \
                   --output-filename=termux_client_arm64 \
                   client.py

            strip build_out/termux_client_arm64

            cp build_out/termux_client_arm64 /workspace/build/
          "

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux_client_arm64
          path: build/termux_client_arm64

  # =========================================================
  # 5) بناء Termux ARMv7 (عبر QEMU - صورة termux-docker:arm)
  # =========================================================
  build-termux-armv7:
    runs-on: [self-hosted, termux, armv7]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pkg update -y
          pkg install -y python clang patchelf zstd ccache binutils termux-elf-cleaner

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client_requirements.txt
          pip install nuitka

      - name: Build
        run: |
          rm -rf build
          mkdir -p build

          python -m nuitka \
            --standalone \
            --onefile \
            --lto=yes \
            --remove-output \
            --output-dir=build \
            --output-filename=termux_client_armv7 \
            client.py

          termux-elf-cleaner build/termux_client_armv7 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux_client_armv7
          path: build/termux_client_armv7
  # =========================================================
  # 6) التجميع النهائي + Push واحد فقط إلى الـ repo
  #    (يعمل فقط إذا نجحت كل الـ 5 عمليات البناء أعلاه)
  # =========================================================
  collect-and-push:
    needs:
      - build-arm64
      - build-armv7
      - build-worker
      - build-termux-arm64
      - build-termux-armv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Gather binaries into builded_packages/
        run: |
          mkdir -p builded_packages
          find downloaded_artifacts -type f -exec cp -v {} builded_packages/ \;
          echo "----- محتويات builded_packages -----"
          ls -la builded_packages/

      - name: Commit and push binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add builded_packages/
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة لعملها commit"
          else
            git commit -m "chore: تحديث الحزم المبنية في builded_packages [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi